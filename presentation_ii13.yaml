  slides:
    - slide_number: 1
      id: "slide_1_enunciation"
      title: "II.13: the enunciation"
      layout: "table_single"
      rows:
        - greek: "Ἐν τοῖς ὀξυγωνίοις τριγώνοις τὸ ἀπὸ τῆς τὴν ὀξεῖαν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον **ἔλαττόν ἐστι** τῶν ἀπὸ τῶν τὴν ὀξεῖαν γωνίαν περιεχουσῶν πλευρῶν τετραγώνων τῷ περιεχομένῳ δὶς ὑπό τε μιᾶς τῶν περὶ τὴν ὀξεῖαν γωνίαν, ἐφ᾿ ἣν ἡ κάθετος πίπτει, καὶ τῆς ἀπολαμβανομένης ἐντὸς ὑπὸ τῆς καθέτου πρὸς τῇ ὀξείᾳ γωνίᾳ."
          english: "In acute-angled triangles, the square on the side subtending the acute angle **is less** than the squares on the sides containing the acute angle by twice the rectangle contained by one of the sides around the acute angle, onto which the perpendicular falls, and the straight-line cut off inside by the perpendicular towards the acute angle."
      segments:
        - id: "s1_intro_and_greek"
          rate: 0.86
          greek: "Ἐν τοῖς ὀξυγωνίοις τριγώνοις τὸ ἀπὸ τῆς τὴν ὀξεῖαν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον ἔλαττόν ἐστι τῶν ἀπὸ τῶν τὴν ὀξεῖαν γωνίαν περιεχουσῶν πλευρῶν τετραγώνων τῷ περιεχομένῳ δὶς ὑπό τε μιᾶς τῶν περὶ τὴν ὀξεῖαν γωνίαν, ἐφ᾿ ἣν ἡ κάθετος πίπτει, καὶ τῆς ἀπολαμβανομένης ἐντὸς ὑπὸ τῆς καθέτου πρὸς τῇ ὀξείᾳ γωνίᾳ."
          english: "Connor has shown you the figure. Here is the enunciation in Greek — one single sentence."
          spoken: >
            ~Connor has shown you the figure.~ **Here is the enunciation — one single sentence!**
            [[break:320ms]]
            Ἐν τοῖς ὀξυγωνίοις τριγώνοις,
            [[break:260ms]]
            τὸ ἀπὸ τῆς τὴν ὀξεῖαν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον,
            [[break:280ms]]
            ἔλαττόν ἐστι,
            [[break:280ms]]
            τῶν ἀπὸ τῶν τὴν ὀξεῖαν γωνίαν περιεχουσῶν πλευρῶν τετραγώνων,
            [[break:300ms]]
            τῷ περιεχομένῳ δὶς ὑπό τε μιᾶς τῶν περὶ τὴν ὀξεῖαν γωνίαν,
            [[break:260ms]]
            ἐφ᾿ ἣν ἡ κάθετος πίπτει,
            [[break:280ms]]
            καὶ τῆς ἀπολαμβανομένης ἐντὸς ὑπὸ τῆς καθέτου πρὸς τῇ ὀξείᾳ γωνίᾳ.
        - id: "s1_translation"
          rate: 0.93
          greek: "ἔλαττόν ἐστι — is less"
          english: "In acute-angled triangles, the square on the side opposite the acute angle is less than the squares on the two sides containing that angle, by twice the rectangle contained by one of those sides — the one the perpendicular falls on — and the piece the perpendicular cuts off inside, towards the acute angle."
          spoken: >
            In acute-angled triangles, the **square on the side opposite the acute angle**
            **is less** than the squares on the two sides containing that angle —
            **by twice the rectangle** contained by one of those sides — ~the one the perpendicular falls on~ —
            and the piece the perpendicular cuts off inside, towards the acute angle.
        - id: "s1_hinge_and_roadmap"
          rate: 0.93
          greek: "ἔλαττόν ἐστι"
          english: "That is the law of cosines — with no cosine, and no minus sign! The two words in bold, ἔλαττόν ἐστι, 'is less,' are the hinge of the sentence. I'm going to pick out two things in this Greek: first, how Greek says 'less than ... by ...' in three cases; second, how Book II names its figures with an article and a preposition, and before long, not even the noun."
          spoken: >
            **That is the law of cosines — with no cosine, and no minus sign!**
            ~The two words in bold,~ ἔλαττόν ἐστι, **"is less," are the hinge of the whole sentence!**
            ~I'm going to pick out two things in this Greek.~
            First: how Greek says **"less than, by" — three grammatical cases, doing the work of an equation!**
            Second: how Book 2 names its figures — ~with an article and a preposition,~ **and before long, not even the noun!**

    - slide_number: 2
      id: "slide_2_three_cases"
      title: "\"Less than ... by ...\": three cases"
      layout: "table_rows"
      header: "λέγω, ὅτι — I say that"
      rows:
        - greek: "**τὸ ἀπὸ τῆς ΑΓ τετράγωνον**"
          english: "the square on AC: *nominative, the subject*"
        - greek: "**ἔλαττόν ἐστι**"
          english: "is less"
        - greek: "**τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων**"
          english: "than the squares on CB, BA: *genitive of comparison*"
        - greek: "**τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ**"
          english: "by twice the rectangle contained by CB, BD: *dative of degree of difference*"
      segments:
        - id: "s2_spec_reading"
          rate: 0.86
          greek: "λέγω, ὅτι τὸ ἀπὸ τῆς ΑΓ τετράγωνον ἔλαττόν ἐστι τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ."
          english: "This is the same claim made for Connor's lettered figure: the specification, after λέγω, ὅτι, 'I say that'. Gamma is C and delta is D, as on the figure."
          spoken: >
            ~This is the same claim made for Connor's lettered figure~ — **the specification**, after λέγω, ὅτι, "I say that".
            ~Remember: Gamma is C, and Delta is D, as on the diagram:~
            [[break:280ms]]
            λέγω, ὅτι τὸ ἀπὸ τῆς ΑΓ τετράγωνον,
            [[break:280ms]]
            ἔλαττόν ἐστι,
            [[break:280ms]]
            τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων,
            [[break:300ms]]
            τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ.
        - id: "s2_three_cases_walkthrough"
          rate: 0.92
          greek: "τὸ ἀπὸ τῆς ΑΓ τετράγωνον · ἔλαττον · τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων · τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ"
          english: "Each line is a different case, and each case has a job: nominative subject, ἔλαττον ('is less'), genitive of comparison ('than'), and dative of degree of difference ('by how much less', with δίς inside the dative phrase)."
          spoken: >
            **Each line on this slide is a different case — and each case has a distinct job!**
            First: the thing compared — ~the square on A, C,~ τὸ ἀπὸ τῆς ΑΓ τετράγωνον — **is nominative; it is the subject!**
            Next, **"is less"**: ἔλαττον, ~the comparative of μικρός, "small".~
            What it is less than — ~the squares on C, B and B, A,~ τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων — **is in the genitive: the genitive of comparison, which does the work of the English word "than"!**
            And finally: **by how much less is in the dative**: τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ —
            **the dative of degree of difference**, ~the very same dative that says~ πέντε ἔτεσι νεώτερος, "five years younger".
            Here the amount is **"twice the rectangle contained by C, B and B, D"** — and even "twice", δίς, **sits right inside the dative phrase!**
        - id: "s2_equation_and_bamberg"
          rate: 0.93
          greek: "AC² = CB² + BA² − 2·CB·BD"
          english: "So nominative, genitive, dative: AC squared equals CB squared plus BA squared, minus twice CB times BD. Euclid doesn't subtract one area from another; he compares two, and names the difference. Professor Bamberg said it about Proposition 3: Greek mathematics has subtraction, but no negative numbers."
          spoken: >
            **So: nominative, genitive, dative!**
            ~A, C squared equals C, B squared plus B, A squared, minus twice C, B times B, D.~
            ~That equation is our modern gloss, not Euclid's.~
            **Euclid doesn't subtract one area from another — he compares two magnitudes, and names the difference!**
            ~As Professor Bamberg pointed out about Proposition 3:~ **Greek mathematics has subtraction, but no negative numbers!**

    - slide_number: 3
      id: "slide_3_ii12_vs_ii13"
      title: "II.12 and II.13: one sentence"
      layout: "table_two_col"
      headers: ["II.12, obtuse", "II.13, acute"]
      rows:
        - greek: "ἀμβλυγωνίοις τριγώνοις"
          english: "ὀξυγωνίοις τριγώνοις"
        - greek: "ἀμβλεῖαν, ἀμβλείᾳ (4 times)"
          english: "ὀξεῖαν, ὀξείᾳ (4 times)"
        - greek: "**μεῖζόν ἐστι** — is greater"
          english: "**ἔλαττόν ἐστι** — is less"
        - greek: "ἐκτός — outside"
          english: "ἐντός — inside"
        - greek: "Def. I.11: ἡ μείζων ὀρθῆς"
          english: "Def. I.12: ἡ ἐλάσσων ὀρθῆς"
      segments:
        - id: "s3_word_for_word"
          rate: 0.92
          greek: "ἀμβλυγωνίοις τριγώνοις · ὀξυγωνίοις τριγώνοις · ἀμβλεῖαν · ὀξεῖαν · μεῖζόν ἐστι · ἔλαττόν ἐστι · ἐκτός · ἐντός"
          english: "The proposition just before ours, 12, is about obtuse-angled triangles, and its enunciation is the same sentence, word for word, with these changes: obtuse for acute, μεῖζον instead of ἔλαττον, and ἐκτός for ἐντός."
          spoken: >
            ~The proposition just before ours — Proposition 12 — is about obtuse-angled triangles,~
            **and its enunciation is the exact same sentence, word for word, with just these changes!**
            First, **obtuse for acute**: ἀμβλυγωνίοις τριγώνοις instead of ὀξυγωνίοις τριγώνοις,
            and ἀμβλεῖαν for ὀξεῖαν ~wherever the angle is mentioned.~
            Second, **greater for less**: μεῖζόν ἐστι instead of ἔλαττόν ἐστι.
            And third, **outside for inside**: ἐκτός instead of ἐντός — **because in an obtuse triangle, the perpendicular lands outside, on the side extended!**
            ~Everything else in the 48-word sentence is identical, including the genitive and the dative.~
        - id: "s3_book1_definitions"
          rate: 0.92
          greek: "ἡ μείζων ὀρθῆς · ἡ ἐλάσσων ὀρθῆς · ἐλάσσων · ἔλαττον"
          english: "And Euclid set this up in Book 1. The definitions of the obtuse and the acute angle are ἡ μείζων ὀρθῆς and ἡ ἐλάσσων ὀρθῆς, with the same genitive of comparison, and the -σσ- vs. -ττ- spelling."
          spoken: >
            **And Euclid set this up right at the start of Book 1!**
            The definitions of the obtuse and the acute angle are "the one greater than a right angle," ἡ μείζων ὀρθῆς,
            and "the one less than a right angle," ἡ ἐλάσσων ὀρθῆς — **using the exact same genitive of comparison!**
            Notice the dialectal spelling too: ~Book 1's definition has a double sigma,~ ἐλάσσων, **while Book 2's proposition has a double tau,** ἔλαττον.

    - slide_number: 4
      id: "slide_4_article_carries_figure"
      title: "The article carries the figure"
      layout: "bullets"
      rows:
        - greek: "τὸ ἀπὸ τῆς ΑΓ τετράγωνον"
          english: "the square *from* AC: ἀπό + genitive"
        - greek: "τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ"
          english: "twice the rectangle contained *by* CB, BD: ὑπό + genitive, the agent"
        - greek: "Def. II.1: περιέχεσθαι λέγεται ὑπὸ δύο … εὐθειῶν"
          english: "\"is said to be contained by two straight lines\""
        - greek: "ἡ κάθετος"
          english: "the perpendicular: κάθετος is an adjective; the noun is εὐθεῖα"
      segments:
        - id: "s4_square_and_rectangle"
          rate: 0.92
          greek: "τὸ ἀπὸ τῆς ΑΓ τετράγωνον · τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ · περιέχεσθαι λέγεται ὑπὸ δύο εὐθειῶν"
          english: "Second feature. Book 2 is about squares and rectangles, and it has a fixed way of naming them: ἀπό with the genitive ('from') for the square, and ὑπό with the genitive ('by', agent of passive περιεχόμενος) for the rectangle, straight from Definition II.1."
          spoken: >
            ~Now for the second grammatical feature.~
            **Book 2 is all about squares and rectangles, and it has a fixed formula for naming them!**
            First: a square is **"the square from A, C"** — τὸ ἀπὸ τῆς ΑΓ τετράγωνον — using ἀπό with the genitive: **the square is drawn up from its side!**
            Second: a rectangle is **"the rectangle contained by C, B and B, D"** — τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ —
            using ὑπό with the genitive, "by", **the preposition for the agent of a passive participle:** περιεχόμενος, ~"being contained".~
            ~That formula comes straight from the first definition of Book 2:~
            a rectangle περιέχεσθαι λέγεται ὑπὸ δύο εὐθειῶν — **"is said to be contained by" the two straight lines at its right angle!**
        - id: "s4_perpendicular"
          rate: 0.92
          greek: "ἡ κάθετος · εὐθεῖα"
          english: "The perpendicular works the same way. κάθετος is an adjective; Book 1's definition applies it to εὐθεῖα, so 'the perpendicular' is really 'the perpendicular straight line', and the article ἡ is feminine because the missing noun is."
          spoken: >
            **The perpendicular works the exact same way!**
            ~In Greek,~ κάθετος is a two-ending adjective.
            ~Book 1's definition applies it to a straight line,~ εὐθεῖα.
            So ἡ κάθετος, "the perpendicular", is really **"the perpendicular straight line"** —
            **and the article** ἡ **is feminine because the understood noun** εὐθεῖα **is feminine!**

    - slide_number: 5
      id: "slide_5_nouns_drop_out"
      title: "Then the nouns drop out"
      layout: "bullets"
      rows:
        - greek: "First step: τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΔ **τετράγωνα** ἴσα ἐστὶ τῷ τε δὶς ὑπὸ τῶν ΓΒ, ΒΔ **περιεχομένῳ ὀρθογωνίῳ** …"
          english: "Early in the proof (up to ἀλλά): all 10 phrases state the noun (τετράγωνα, ὀρθογωνίῳ)."
        - greek: "Later: τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ·"
          english: "From ἀλλά to ὥστε: all 7 phrases drop the noun — neuter article + ἀπό (square) or ὑπό (rectangle)."
        - greek: "No noun and no verb: τοῖς μὲν ἀπὸ τῶν ΒΔ, ΔΑ ἴσον τὸ ἀπὸ τῆς ΑΒ"
          english: "\"(The square) on AB (is) equal to (the squares) on BD, DA\" — ἐστί omitted."
        - greek: "ὅπερ ἔδει δεῖξαι — over to Zahid."
          english: "Which is the very thing it was required to show."
      segments:
        - id: "s5_comparison_of_two_steps"
          rate: 0.91
          greek: "τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΔ τετράγωνα ἴσα ἐστὶ τῷ τε δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ · τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ"
          english: "Once the convention is set, Euclid stops spelling it out. In the first step, the nouns are there: τετράγωνα, ὀρθογωνίῳ. In the later step, they're gone: with neuter article and ἀπό it's a square; with ὑπό it's a rectangle."
          spoken: >
            **Once that convention is established, Euclid stops spelling the nouns out!**
            ~Compare these two sentences from the proof.~
            First, in the opening step, **the nouns are stated explicitly**:
            [[break:220ms]]
            τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΔ τετράγωνα,
            [[break:250ms]]
            ἴσα ἐστὶ τῷ τε δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ.
            [[break:300ms]]
            Later in the proof, **the nouns are completely gone**:
            [[break:220ms]]
            τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ,
            [[break:250ms]]
            ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ.
            [[break:280ms]]
            ~Literally: "the from C, B and B, A are equal to the from A, C, and to twice the by C, B, B, D."~
            **Because the article is neuter, the preposition alone tells you the figure:** with ἀπό **it is a square;** with ὑπό **it is a rectangle!**
        - id: "s5_second_half_and_copula"
          rate: 0.92
          greek: "τοῖς μὲν ἀπὸ τῶν ΒΔ, ΔΑ ἴσον τὸ ἀπὸ τῆς ΑΒ"
          english: "In the second half of the proof, from ἀλλά, every square and rectangle is named this way, until the last sentence puts most of the nouns back. Sometimes even the verb goes: τοῖς μὲν ἀπὸ τῶν ΒΔ, ΔΑ ἴσον τὸ ἀπὸ τῆς ΑΒ."
          spoken: >
            ~In fact, in the second half of the proof~ — starting from ἀλλά, "but" — **all seven figure phrases drop the noun!**
            **Sometimes even the verb "is" drops out:**
            [[break:220ms]]
            τοῖς μὲν ἀπὸ τῶν ΒΔ, ΔΑ ἴσον τὸ ἀπὸ τῆς ΑΒ —
            [[break:220ms]]
            ~"to the from B, D and D, A, equal the from A, B."~
            **Fitzpatrick's English translation has to put the missing words back in parentheses!**
        - id: "s5_handoff_to_zahid"
          rate: 0.93
          greek: "ὅπερ ἔδει δεῖξαι"
          english: "So the two features meet in that dative: less by twice the rectangle, with the rectangle left for you to supply. Why it's less by exactly that much is Zahid's. ὅπερ ἔδει δεῖξαι — over to Zahid."
          spoken: >
            **So our two grammatical features meet right in that dative phrase: "less by twice the rectangle"** — ~with the noun for rectangle left for the reader to supply!~
            Why it is less by that exact amount is Zahid's part of the presentation.
            [[break:240ms]]
            ὅπερ ἔδει δεῖξαι — **over to you, Zahid!**
