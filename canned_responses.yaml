  - id: prop_i47_pythagorean
    title: "Prop. I.47 Pythagorean Theorem (Enunciation)"
    question: "State Proposition I.47, the Pythagorean theorem, in Greek and English."
    sources:
      - "Elements I.47"
      - "COURSE.md"
    tts_backend: "google_erasmian"
    tts_voice: "en-US-Neural2-D"
    wav_path: ".cache/canned/prop_i47_pythagorean.wav"
    english: "In right-angled triangles, the square on the side subtending the right-angle is equal to the squares on the sides containing the right-angle. Being a theorem rather than a construction problem, its proof concludes with: which very thing it was required to show."
    greek: "Ἐν τοῖς ὀρθογωνίοις τριγώνοις τὸ ἀπὸ τῆς τὴν ὀρθὴν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον ἴσον ἐστὶ τοῖς ἀπὸ τῶν τὴν ὀρθὴν γωνίαν περιεχουσῶν πλευρῶν τετραγώνοις. Θεώρημα γὰρ ὂν τελευτᾷ εἰς τό· ὅπερ ἔδει δεῖξαι."
    sentences:
      - english: "In right-angled triangles, the square on the side subtending the right-angle is equal to the squares on the sides containing the right-angle."
        greek: "Ἐν τοῖς ὀρθογωνίοις τριγώνοις τὸ ἀπὸ τῆς τὴν ὀρθὴν γωνίαν ὑποτεινούσης πλευρᾶς τετράγωνον ἴσον ἐστὶ τοῖς ἀπὸ τῶν τὴν ὀρθὴν γωνίαν περιεχουσῶν πλευρῶν τετραγώνοις."
      - english: "Being a theorem rather than a construction problem, its proof concludes with: which very thing it was required to show."
        greek: "Θεώρημα γὰρ ὂν τελευτᾷ εἰς τό· ὅπερ ἔδει δεῖξαι."

  - id: postulate_5_and_i23
    title: "Postulate 5 & Prop. I.23 in Non-Euclidean Geometry"
    question: "Does Proposition I.23 depend on Postulate 5, and does it hold in spherical and hyperbolic geometry?"
    sources:
      - "projects/2026-project-i23/other-geometries/slides.qmd"
      - "Elements Book I Definitions & Axioms"
    tts_backend: "google_erasmian"
    tts_voice: "en-US-Neural2-D"
    wav_path: ".cache/canned/postulate_5_and_i23.wav"
    english: "Proposition I.23 relies only on Proposition I.22 to construct a triangle from three straight-lines and Proposition I.8 for side-side-side congruence, never invoking the fifth postulate before I.29. Therefore, the construction of an equal angle carries over directly to hyperbolic geometry and to sufficiently small triangles on the sphere."
    greek: "Ἡ κγʹ πρότασις χρῆται μόναις τῇ κβʹ καὶ τῇ ηʹ προτάσει ἄνευ τοῦ πέμπτου αἰτήματος. Διὸ δὴ ἡ τῆς ἴσης γωνίας σύστασις μένει βεβαία καὶ ἐν τῇ ὑπερβολικῇ καὶ ἐν τῇ σφαιρικῇ γεωμετρίᾳ."
    sentences:
      - english: "Proposition I.23 relies only on Proposition I.22 to construct a triangle from three straight-lines and Proposition I.8 for side-side-side congruence, never invoking the fifth postulate before I.29."
        greek: "Ἡ κγʹ πρότασις χρῆται μόναις τῇ κβʹ καὶ τῇ ηʹ προτάσει ἄνευ τοῦ πέμπτου αἰτήματος."
      - english: "Therefore, the construction of an equal angle carries over directly to hyperbolic geometry and to sufficiently small triangles on the sphere."
        greek: "Διὸ δὴ ἡ τῆς ἴσης γωνίας σύστασις μένει βεβαία καὶ ἐν τῇ ὑπερβολικῇ καὶ ἐν τῇ σφαιρικῇ γεωμετρίᾳ."
