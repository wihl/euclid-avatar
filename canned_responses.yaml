canned_responses:
  - id: "ii13_verbs"
    title: "1. Graeme Bird: Key Verb Parses in II.13 (τέτμηται, ἤχθω, προσκείσθω, ὑποτεινούσης)"
    question: "Can you parse the key verbs in Proposition II.13 — especially τέτμηται, ἤχθω, προσκείσθω, and ὑποτεινούσης?"
    sources: ["2026-greek-07/solution.qmd", "Elements II.13", "2026-project-ii13/greek/writeup.qmd"]
    tts_backend: "google_au_bilingual"
    tts_voice: "en-AU-Neural2-D"
    wav_path: "logs/audio/canned_ii13_verbs.wav"
    english: "In Proposition II.13, τέτμηται is the third-person singular perfect middle-passive indicative of τέμνω, from fifth principal part τέτμημαι, meaning 'has been cut'. The imperative ἤχθω is the third-person singular perfect middle-passive imperative of ἄγω, from ἦγμαι with vowel reduplication, meaning 'let it have been drawn'. Finally, προσκείσθω is the third-person singular present deponent imperative of πρόσκειμαι, 'let it be added', while ὑποτεινούσης is the present active participle feminine genitive singular of ὑποτείνω, 'stretching under' or 'subtending'."
    greek: "τέτμηται (τέμνω, PP V τέτμημαι) · ἤχθω (ἄγω, PP V ἦγμαι) · προσκείσθω (πρόσκειμαι, PP I) · ὑποτεινούσης (ὑποτείνω, PP I)."
    sentences:
      - greek: "τέτμηται · τέμνω · τέτμημαι"
        english: "In Proposition II.13, τέτμηται is the third-person singular perfect middle-passive indicative of τέμνω, from the fifth principal part τέτμημαι with reduplication, meaning 'has been cut'."
        spoken: "In Proposition 2.13, τέτμηται is the third-person singular perfect middle-passive indicative of τέμνω, from the fifth principal part τέτμημαι with reduplication, meaning 'has been cut'."
      - greek: "ἤχθω · ἄγω · ἦγμαι"
        english: "The construction verb ἤχθω is the third-person singular perfect middle-passive imperative of ἄγω, from ἦγμαι with lengthened vowel reduplication, meaning 'let it have been drawn'."
        spoken: "The construction verb ἤχθω is the third-person singular perfect middle-passive imperative of ἄγω, from ἦγμαι with lengthened vowel reduplication, meaning 'let it have been drawn'."
      - greek: "προσκείσθω · πρόσκειμαι · ὑποτεινούσης · ὑποτείνω"
        english: "Meanwhile, προσκείσθω is the present deponent imperative of πρόσκειμαι, 'let it be added', and ὑποτεινούσης is the present active participle feminine genitive singular of ὑποτείνω, literally 'stretching under' — the Greek root of our word hypotenuse."
        spoken: "Meanwhile, προσκείσθω is the present deponent imperative of πρόσκειμαι, 'let it be added', and ὑποτεινούσης is the present active participle feminine genitive singular of ὑποτείνω, literally 'stretching under' — the Greek root of our word hypotenuse."

  - id: "ii13_accents_adjectives"
    title: "2. Graeme Bird: Enclitic Accent in ἔλαττόν ἐστι & Two-Ending Adjective ἡ κάθετος"
    question: "Why does ἔλαττόν ἐστι have two accents, and why does ἡ κάθετος have a feminine article with an -ος ending?"
    sources: ["2026-project-ii13/greek/writeup.qmd", "Luschnig & Mitchell p. 195", "Elements Def. I.10"]
    tts_backend: "google_au_bilingual"
    tts_voice: "en-AU-Neural2-D"
    wav_path: "logs/audio/canned_ii13_accents_adjectives.wav"
    english: "Because ἔλαττον is a proparoxytone accented on the third syllable from the end, the following two-syllable enclitic ἐστι throws a secondary acute accent onto the final syllable of ἔλαττόν, giving ἔλαττόν ἐστι — just as properispomenon μεῖζον becomes μεῖζόν ἐστι in Proposition II.12. As for ἡ κάθετος, compound adjectives like κάθετος, ὀξυγώνιος, and ἀμβλυγώνιος are adjectives of two endings, using -ος for both masculine and feminine; here the feminine article ἡ agrees with the understood feminine noun εὐθεῖα, 'straight line', from Book I Definition 10."
    greek: "ἔλαττόν ἐστι · μεῖζόν ἐστι · ἡ ἐφεστηκυῖα εὐθεῖα κάθετος καλεῖται (Def. I.10)."
    sentences:
      - greek: "ἔλαττόν ἐστι · μεῖζόν ἐστι"
        english: "Because ἔλαττον is accented on the antepenult, the following two-syllable enclitic ἐστι throws a second acute accent onto its final syllable, producing ἔλαττόν ἐστι, just as properispomenon μεῖζον becomes μεῖζόν ἐστι in Proposition 12."
        spoken: "Because ἔλαττον is accented on the antepenult, the following two-syllable enclitic ἐστι throws a second acute accent onto its final syllable, producing ἔλαττόν ἐστι, just as properispomenon μεῖζον becomes μεῖζόν ἐστι in Proposition 12."
      - greek: "ἡ κάθετος · ἡ ἐφεστηκυῖα εὐθεῖα κάθετος καλεῖται"
        english: "As for ἡ κάθετος, compound adjectives like κάθετος, ὀξυγώνιος, and ἀμβλυγώνιος have only two endings, using the -ος form for both masculine and feminine; the feminine article ἡ agrees with the understood noun εὐθεῖα from Book 1 Definition 10: ἡ ἐφεστηκυῖα εὐθεῖα κάθετος καλεῖται."
        spoken: "As for ἡ κάθετος, compound adjectives like κάθετος, ὀξυγώνιος, and ἀμβλυγώνιος have only two endings, using the omicron-sigma form for both masculine and feminine; the feminine article ἡ agrees with the understood noun εὐθεῖα from Book 1 Definition 10: ἡ ἐφεστηκυῖα εὐθεῖα κάθετος καλεῖται."

  - id: "ii13_misprints"
    title: "3. Graeme Bird: The Two Misprints in Fitzpatrick p. 65 (τετραγώνιος, γωνίᾳ)"
    question: "Did you find any misprints in Fitzpatrick's Greek text of Proposition II.13 on page 65?"
    sources: ["2026-project-ii13/greek/writeup.qmd", "Elements II.13 p. 65", "Elements II.12 p. 64"]
    tts_backend: "google_au_bilingual"
    tts_voice: "en-AU-Neural2-D"
    wav_path: "logs/audio/canned_ii13_misprints.wav"
    english: "Yes, we found and emended two misprints in the proof of II.13 on page 65 of Fitzpatrick's edition. First, after καὶ τοῖς ἀπὸ τῶν ΑΔ, ΔΓ, the edition prints τετραγώνιος with iota-omicron instead of the dative plural τετραγώνοις required to agree with τοῖς. Second, in the clause ὀρθὴ γὰρ ἡ πρὸς τῷ Δ γωνία, it prints γωνίᾳ with an iota subscript, even though γωνία is nominative singular, the subject of the clause."
    greek: "τοῖς ἀπὸ τῶν ΑΔ, ΔΓ τετραγώνοις (ed. τετραγώνιος) · ὀρθὴ γὰρ ἡ πρὸς τῷ Δ γωνία (ed. γωνίᾳ)."
    sentences:
      - greek: "καὶ τοῖς ἀπὸ τῶν ΑΔ, ΔΓ τετραγώνοις"
        english: "Yes, there are two misprints in the proof of Proposition II.13 on page 65 of Fitzpatrick's edition: first, after καὶ τοῖς ἀπὸ τῶν ΑΔ, ΔΓ, it prints τετραγώνιος instead of the dative plural τετραγώνοις agreeing with τοῖς."
        spoken: "Yes, there are two misprints in the proof of Proposition 2.13 on page 65 of Fitzpatrick's edition: first, after καὶ τοῖς ἀπὸ τῶν ΑΔ, ΔΓ, it prints τετραγώνιος instead of the dative plural τετραγώνοις agreeing with τοῖς."
      - greek: "ὀρθὴ γὰρ ἡ πρὸς τῷ Δ γωνία · ὑπό τε"
        english: "Second, in ὀρθὴ γὰρ ἡ πρὸς τῷ Δ γωνία, it prints γωνίᾳ with an iota subscript, though γωνία is the nominative subject; and on page 64, II.12's enunciation also prints ὑπὸ τε with a grave accent before enclitic τε where its conclusion rightly prints ὑπό τε."
        spoken: "Second, in ὀρθὴ γὰρ ἡ πρὸς τῷ Δ γωνία, it prints γωνία with an iota subscript, though γωνία is the nominative subject; and on page 64, Proposition 12's enunciation also prints ὑπὸ τε with a grave accent before enclitic τε, where its own conclusion rightly prints ὑπό τε."

  - id: "ii13_proof_ii7_i47"
    title: "4. Paul Bamberg: How II.13 Uses II.7 and I.47 Without Subtraction/Negatives"
    question: "How does Euclid prove Proposition II.13 using II.7 and I.47 without using subtraction or negative numbers?"
    sources: ["Elements II.13", "Elements II.7", "Elements I.47", "2026-project-ii13/greek/writeup.qmd"]
    tts_backend: "google_au_bilingual"
    tts_voice: "en-AU-Neural2-D"
    wav_path: "logs/audio/canned_ii13_proof_ii7_i47.wav"
    english: "Because the base ΓΒ is cut at Δ, Proposition II.7 gives purely additively that the squares on ΓΒ and ΒΔ equal twice the rectangle contained by ΓΒ, ΒΔ plus the square on ΔΓ. Euclid then adds the square on the perpendicular ΔΑ to both sides — κοινὸν προσκείσθω τὸ ἀπὸ τῆς ΔΑ τετράγωνον — and applies the Pythagorean theorem, I.47, to the two right triangles at Δ, yielding ΓΒ² + ΒΑ² = ΑΓ² + 2·ΓΒ·ΒΔ, which he states as a comparison: ΑΓ² is less than ΓΒ² + ΒΑ² by twice the rectangle ΓΒ, ΒΔ."
    greek: "Ἐπεὶ γὰρ εὐθεῖα ἡ ΓΒ τέτμηται, ὡς ἔτυχεν, κατὰ τὸ Δ, τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΔ τετράγωνα ἴσα ἐστὶ τῷ τε δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ καὶ τῷ ἀπὸ τῆς ΔΓ τετραγώνῳ. κοινὸν προσκείσθω τὸ ἀπὸ τῆς ΔΑ τετράγωνον."
    sentences:
      - greek: "Ἐπεὶ γὰρ εὐθεῖα ἡ ΓΒ τέτμηται, ὡς ἔτυχεν, κατὰ τὸ Δ"
        english: "Because the straight line CB is cut at D — Ἐπεὶ γὰρ εὐθεῖα ἡ ΓΒ τέτμηται, ὡς ἔτυχεν, κατὰ τὸ Δ — Book 2 Proposition 7 gives additively that the squares on CB and BD equal twice the rectangle contained by CB, BD together with the square on DC."
        spoken: "Because the straight line C B is cut at D — Ἐπεὶ γὰρ εὐθεῖα ἡ ΓΒ τέτμηται, ὡς ἔτυχεν, κατὰ τὸ Δ — Book 2 Proposition 7 gives additively that the squares on C B and B D equal twice the rectangle contained by C B, B D together with the square on D C."
      - greek: "κοινὸν προσκείσθω τὸ ἀπὸ τῆς ΔΑ τετράγωνον · τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ"
        english: "Adding the square on the perpendicular DA to both sides — κοινὸν προσκείσθω τὸ ἀπὸ τῆς ΔΑ τετράγωνον — and applying Proposition I.47 twice at the right angle at D yields τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ, avoiding any negative areas."
        spoken: "Adding the square on the perpendicular D A to both sides — κοινὸν προσκείσθω τὸ ἀπὸ τῆς ΔΑ τετράγωνον — and applying Proposition 1.47 twice at the right angle at D yields τὰ ἄρα ἀπὸ τῶν ΓΒ, ΒΑ ἴσα ἐστὶ τῷ τε ἀπὸ τῆς ΑΓ καὶ τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ, avoiding any negative areas."

  - id: "ii13_non_euclidean"
    title: "5. Paul Bamberg: II.13 in Spherical & Hyperbolic Geometry (Law of Cosines)"
    question: "How does Proposition II.13 behave in spherical and hyperbolic geometry?"
    sources: ["MathNotes08.pdf", "Elements II.13", "2026-project-ii13/greek/writeup.qmd"]
    tts_backend: "google_au_bilingual"
    tts_voice: "en-AU-Neural2-D"
    wav_path: "logs/audio/canned_ii13_non_euclidean.wav"
    english: "Euclid's area-based proof of Proposition II.13 does not carry over to spherical or hyperbolic geometry because neither geometry admits rectangles — a quadrilateral with four right angles has angle sum 2π, which exists only in the Euclidean plane — and Proposition I.47 depends on the fifth postulate. Instead, on the unit sphere we have cos c = cos a cos b + sin a sin b cos B, and in hyperbolic geometry cosh c = cosh a cosh b - sinh a sinh b cos B; expanding to second order for small triangles via Taylor series recovers Euclid's II.13: b² = a² + c² - 2ac cos B."
    greek: "τὸ ἀπὸ τῆς ΑΓ τετράγωνον ἔλαττόν ἐστι τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ."
    sentences:
      - greek: "ὀρθογωνίῳ · τετράγωνον"
        english: "Euclid's proof of II.13 relies on squares and rectangles — τετράγωνον and ὀρθογωνίῳ — together with the Pythagorean theorem I.47, which holds only in Euclidean geometry where the parallel postulate is valid and four-right-angled rectangles exist."
        spoken: "Euclid's proof of 2.13 relies on squares and rectangles — τετράγωνον and ὀρθογωνίῳ — together with the Pythagorean theorem 1.47, which holds only in Euclidean geometry where the parallel postulate is valid and four-right-angled rectangles exist."
      - greek: "ἔλαττόν ἐστι τῶν ἀπὸ τῶν ΓΒ, ΒΑ τετραγώνων τῷ δὶς ὑπὸ τῶν ΓΒ, ΒΔ περιεχομένῳ ὀρθογωνίῳ"
        english: "In spherical geometry the law of cosines is cos b = cos a cos c + sin a sin c cos B, and in hyperbolic geometry cosh b = cosh a cosh c minus sinh a sinh c cos B; in the flat limit of small sides, second-order Taylor expansion recovers Euclid's ἔλαττόν ἐστι relation."
        spoken: "In spherical geometry the law of cosines is cosine b equals cosine a cosine c plus sine a sine c cosine B, and in hyperbolic geometry hyperbolic cosine b equals hyperbolic cosine a hyperbolic cosine c minus hyperbolic sine a hyperbolic sine c cosine B; in the flat limit of small sides, second-order Taylor expansion recovers Euclid's ἔλαττόν ἐστι relation."
